services:
  postgres:
    image: postgres:16-alpine
    container_name: securebank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: securebank
      POSTGRES_PASSWORD: securebank
      POSTGRES_DB: securebank_ai
    ports:
      - "5432:5432"
    volumes:
      - securebank-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securebank -d securebank_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Transaction Intelligence FastAPI sidecar (Phase 2).
  # Next.js calls TRANSACTION_AI_URL (default http://127.0.0.1:8001).
  transaction-ai:
    build:
      context: ./ml/transaction-ai
    container_name: securebank-transaction-ai
    restart: unless-stopped
    ports:
      - "8001:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 8

volumes:
  securebank-postgres-data:
